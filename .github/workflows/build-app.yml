name: Build App

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  build_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # `go-releaser` will read the semver version from git tag name
          # `git-chglog` will diff the tag and generate changelog
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Setup git-chglog
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/git-chglog/git-chglog/cmd/git-chglog@v0.15.4
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/git-chglog" --version

      - name: Create local tag for dry run
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/$VERSION" > /dev/null; then
            tag_commit="$(git rev-list -n 1 "$VERSION")"
            head_commit="$(git rev-parse HEAD)"
            if [[ "$tag_commit" != "$head_commit" ]]; then
              echo "Tag $VERSION already points to $tag_commit, expected $head_commit."
              exit 1
            fi
          else
            git tag "$VERSION"
          fi

      - name: Pre Build
        run: |-
          mkdir -p local

          # changelog
          git-chglog --config .github/chglog/config.yml "$VERSION" > local/release-notes.md

          # copy config file
          cp conf/artalk.example.yml artalk.yml
        env:
          VERSION: ${{ inputs.version }}

      - name: Print Release Notes
        run: cat local/release-notes.md

      - name: Build and Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --release-notes local/release-notes.md ${{ inputs.dry_run && '--skip=publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ inputs.dry_run && '' || github.token }}
