name: Build UI

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  build_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Use pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.2

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack npm package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          package_version="v$(node --print "require('./ui/artalk/package.json').version")"
          if [[ "$package_version" != "$VERSION" ]]; then
            echo "Package version $package_version does not match release version $VERSION."
            exit 1
          fi

          pnpm --filter artalk pack --pack-destination "$RUNNER_TEMP"
          package_file="$RUNNER_TEMP/artalk-${package_version#v}.tgz"
          if [[ ! -f "$package_file" ]]; then
            echo "Expected package tarball was not created: $package_file"
            exit 1
          fi
          echo "PACKAGE_FILE=$package_file" >> "$GITHUB_ENV"

      - name: Validate package
        if: ${{ inputs.dry_run }}
        run: npm publish "$PACKAGE_FILE" --dry-run --access public

      - name: Publish
        if: ${{ !inputs.dry_run }}
        # npm validates build.yml, the calling workflow, for trusted publishing.
        run: npm publish "$PACKAGE_FILE" --access public

