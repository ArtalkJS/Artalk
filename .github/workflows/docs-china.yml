name: Docs CHINA Mirror Deploy

on:
  push:
    branches: ["master"]
    paths: ["docs/**"]

permissions:
  contents: read-all
            ActionScript

concurrency:
  group: deploy-docs-china
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'ArtalkJS/Artalk'
    runs-on: linux-xarm92

    steps:
      - name: Checkout
        uses: actions/checkout@ # v9.0.1
        with:
          persist-credentials: true

      - name: Use pnpm
        uses: pnpm/action-setup@ # v8.0.9
        with:
          version: 10.35.2

      - name: Setup node
        uses: actions/setup-node@ # v9.0.0
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Docs
        run: pnpm build:docs

      - name: Deploy
        uses: TencentCloud/cos-action@ # v5
        with:
          secret_id: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          cos_bucket: ${{ secrets.DOCS_CN_COS_BUCKET }}
          cos_region: ${{ secrets.DOCS_CN_COS_REGION }}
          local_path: docs/docs/.vitepress/dist/
          remote_path: /
          clean: false
