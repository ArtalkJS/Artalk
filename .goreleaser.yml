# Goreleaser Config
#
# https://goreleaser.com/quick-start/
# https://goreleaser.com/customization/
# https://goreleaser.com/customization/templates/
# https://goreleaser.com/customization/fury/
# https://goreleaser.com/customization/announce/telegram/

version: 2

project_name: artalk

env:
  - GO111MODULE=on
  - CGO_ENABLED=0

before:
  hooks:
    # install dependencies
    - make install
    - make build-frontend
    - make pack-frontend

# build multi-platform
builds:
  ## ----------------------
  ##        Linux
  ## ----------------------

  # Linux (amd_64)
  - id: linux-amd64
    goos:
      - linux
    goarch:
      - amd64
    binary: "{{.ProjectName}}"
    main: ./main.go
    ldflags: &common_ldflags |
      -s -w

  # Linux (arm_64)
  - id: linux-arm64
    goos:
      - linux
    goarch:
      - arm64
    binary: "{{.ProjectName}}"
    main: ./main.go
    ldflags: *common_ldflags

  # Linux (arm_v7)
  - id: linux-arm7
    goos:
      - linux
    goarch:
      - arm
    goarm:
      - "7"
    binary: "{{.ProjectName}}"
    main: ./main.go
    ldflags: *common_ldflags

  ## ----------------------
  ##        macOS
  ## ----------------------

  # Darwin (amd_64)
  - id: darwin-amd64
    goos:
      - darwin
    goarch:
      - amd64
    binary: "{{.ProjectName}}"
    main: ./main.go
    ldflags: *common_ldflags

  # Darwin (arm_64)
  - id: darwin-arm64
    goos:
      - darwin
    goarch:
      - arm64
    binary: "{{.ProjectName}}"
    main: ./main.go
    ldflags: *common_ldflags

  ## ----------------------
  ##         Win
  ## ----------------------

  # Win (amd_64)
  - id: windows-amd64
    goos:
      - windows
    goarch:
      - amd64
    binary: "{{.ProjectName}}"
    main: ./main.go
    ldflags: *common_ldflags
    flags:
      # https://go-review.googlesource.com/c/go/+/224588/
      # https://github.com/ArtalkJS/Artalk/issues/35
      &win_common_flags |
      -tags=timetzdata

  # Win (arm_64)
  - id: windows-arm64
    goos:
      - windows
    goarch:
      - arm64
    binary: "{{.ProjectName}}"
    main: ./main.go
    ldflags: *common_ldflags
    flags: *win_common_flags

archives:
  - id: artalk
    ids:
      - linux-amd64
      - darwin-amd64
      - windows-amd64
      - windows-arm64
      - linux-arm7
      - linux-arm64
      - darwin-arm64
    name_template: "{{.ProjectName}}_v{{.Version}}_{{.Os}}_{{.Arch}}{{.Arm}}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    wrap_in_directory: true
    files:
      - README*
      - LICENSE*
      - artalk.yml

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{.Version}}-SNAPSHOT-{{.ShortCommit}}"

# changelog:
#   sort: asc
#   filters:
#     exclude:
#       - '^docs:'
#       - '^test:'
#       - '^chore:'

release:
  github:
    owner: ArtalkJS
    name: Artalk
  prerelease: auto
  draft: false
  extra_files:
    - glob: ./local/release_includes/*
