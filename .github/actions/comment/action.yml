name: Comment issue
description: Create comment on a issue

inputs:
  issue_number:
    required: true
    description: The issue number you want to comment
  content:
    required: true
    description: The content of comment

runs:
  using: "composite"
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        STDOUT: ${{ inputs.content }}
      with:
        script: |
          const issueNumber = Number.parseInt(process.env.ISSUE_NUMBER, 10)
          if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
            throw new Error('Invalid issue number')
          }

          github.rest.issues.createComment({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: process.env.STDOUT
          })
